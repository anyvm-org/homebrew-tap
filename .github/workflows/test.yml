name: Test formula

# Note: pushes made by bump.yml with the default GITHUB_TOKEN do not
# trigger this workflow (GitHub suppresses recursive workflow runs);
# bump.yml runs its own install + test before pushing instead. This
# workflow covers user pushes, PRs, and manual runs.

on:
  push:
    branches: [main]
    paths:
      - "Formula/**"
      - ".github/workflows/test.yml"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7

      # Homebrew refuses to install a formula from a bare file path
      # ("Homebrew requires formulae to be in a tap"), so register the
      # checkout itself as the anyvm-org/tap tap and install by name.
      - name: Register the checkout as the anyvm-org/tap tap
        run: |
          tapdir="$(brew --repository)/Library/Taps/anyvm-org/homebrew-tap"
          mkdir -p "$(dirname "$tapdir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tapdir"

      - name: Install from the local checkout
        run: brew install anyvm-org/tap/anyvm

      - name: Test
        run: |
          brew test anyvm-org/tap/anyvm
          anyvm --help
          anyvm.py --help
