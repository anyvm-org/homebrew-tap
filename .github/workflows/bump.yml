name: Bump formula

# Checks PyPI daily for a new anyvm.py release. When one is found, the
# formula is updated, installed and tested on a macOS runner, and the
# bump is pushed only if the install + test pass.

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:

permissions: {} # default to none

jobs:
  bump:
    runs-on: macos-latest
    permissions:
      - contents: read  # read-only until tested
    outputs:
      - changed: ${{ steps.bump.outputs.changed || 'false' }}
    steps:
      - uses: actions/checkout@v7

      - name: Update formula from PyPI
        id: bump
        run: |
          python3 .github/scripts/bump.py
          if git diff --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
            git diff
          fi

  release-bump:
    needs: [bump]
    if: ${{ needs.bump.outputs.changed == 'true' }}
    runs-on: macos-latest
    permissions:
      - contents: write  # full write access
    steps:
      # these two steps should actually just download an artifact of the
      # expected changed files (e.g., filtered against injection)
      - uses: actions/checkout@v7
      - name: Prepare for Install
        id: rebump
        run: |
          python3 .github/scripts/bump.py

      # Homebrew refuses to install a formula from a bare file path
      # ("Homebrew requires formulae to be in a tap"), so register the
      # checkout itself as the anyvm-org/tap tap and install by name --
      # this picks up the just-updated formula, not the GitHub main copy.
      - name: Install and test the updated formula
        run: |
          tapdir="$(brew --repository)/Library/Taps/anyvm-org/homebrew-tap"
          mkdir -p "$(dirname "$tapdir")"
          ln -sfn "$GITHUB_WORKSPACE" "$tapdir"
          brew install anyvm-org/tap/anyvm
          brew test anyvm-org/tap/anyvm
          anyvm --help
          anyvm.py --help

      - name: Commit and push
        run: |
          version="$(sed -n 's/.*anyvm_py-\([0-9][^"]*\)\.tar\.gz.*/\1/p' Formula/anyvm.rb | head -1)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add Formula/anyvm.rb
          git commit -m "anyvm ${version}"
          git push
